[project]
name = "month-overflow-adjuster"
version = "0.1.1"
description = "Adds or subtracts whole months to a date or datetime, clamping the day to the last day of the target month instead of overflowing into the following one."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
